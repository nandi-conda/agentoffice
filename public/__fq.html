<!doctype html><link rel="stylesheet" href="/style.css"><div class="av-stage" style="display:flex;gap:8px"></div>
<script type="module">
class Sig { constructor(v){this.v=v;this.s=new Set()} peek(){return this.v} subscribe(f){this.s.add(f);return()=>this.s.delete(f)} set(v){this.v=v;this.s.forEach(f=>f(v))} }
customElements.define('moq-publish', class extends HTMLElement { video = { source: new Sig(null) } });
customElements.define('moq-watch', class extends HTMLElement { broadcast = { catalog: new Sig(undefined), status: new Sig('offline') } });
const { createFreeqCall } = await import('/js/freeq-av.js');
const stage = document.querySelector('.av-stage');
const c = createFreeqCall({ send(){}, stage });
c.want('z', true);
await c.setCam(true);
c.onMessage({ zone:'z', channel:'#x', call:{ session:'s', roster:[{nick:'me',instance:null},{nick:'bob',instance:'aa'},{nick:'amy',instance:'bb'}] }, joined:{ session:'s', nick:'me', token:'t' } });
await new Promise(r=>setTimeout(r,300));
const w = [...stage.querySelectorAll('moq-watch')];
w.find(x=>x.getAttribute('name')==='s/bob~aa').broadcast.catalog.set({ audio:{}, video:{} });
w.find(x=>x.getAttribute('name')==='s/amy~bb').broadcast.catalog.set({ audio:{} });
window.done = [...stage.querySelectorAll('.tile')].map(t=>t.className+' | '+t.querySelector('.tag').textContent+' | '+(t.querySelector('moq-publish video')?'preview':''));
</script>
