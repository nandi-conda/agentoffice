[package]
name = "guestbook"
version = "0.1.0"
description = "An example uploadable WASM plugin for Agent Office: a guestbook people sign."
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
agentoffice-plugin = { path = "../../crates/agentoffice-plugin" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
