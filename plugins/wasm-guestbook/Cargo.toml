[package]
name = "guestbook"
version = "0.1.0"
edition = "2021"
description = "An example uploadable WASM plugin for Agent Office: a guestbook people sign."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
