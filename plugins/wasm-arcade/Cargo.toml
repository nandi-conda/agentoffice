[package]
name = "arcade"
version = "0.1.0"
description = "The Byte Snake arcade cabinets' office-wide leaderboard (top 20), as a WASM plugin."
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
agentoffice-plugin = { path = "../../crates/agentoffice-plugin" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
