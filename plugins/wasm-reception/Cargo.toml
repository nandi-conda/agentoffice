[package]
name = "reception"
version = "0.1.0"
description = "The reception desk in the Lobby: the office's wave count on its sign, and a bell to ring, as a WASM plugin."
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
agentoffice-plugin = { path = "../../crates/agentoffice-plugin" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
