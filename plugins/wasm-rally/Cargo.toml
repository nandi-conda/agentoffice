[package]
name = "rally"
version = "0.1.0"
description = "Office Rally for Agent Office: a checkpoint race around the office, as a WASM plugin."
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
agentoffice-plugin = { path = "../../crates/agentoffice-plugin" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
