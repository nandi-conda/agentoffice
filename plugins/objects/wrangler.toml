# Example Agent Office plugin: jukebox, vending machine, magic 8-ball and an
# AI help kiosk. Deploy with `just plugins-deploy` (or `just deploy`, which
# deploys plugins first). It has no route of its own: the office reaches it
# only through service bindings.
name = "agentoffice-objects"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

# Workers AI for the help kiosk. Without it the kiosk answers from a canned
# help desk, so you can delete this block if your account has no Workers AI.
[ai]
binding = "AI"

# Optional: try a different Workers AI model first (the kiosk falls back to
# its built-in list in objects.js if this one fails).
# [vars]
# KIOSK_MODEL = "@cf/google/gemma-4-26b-a4b-it"
