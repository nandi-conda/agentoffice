[package]
name = "kiosk"
version = "0.1.0"
description = "The office help kiosk: answers with the office's language model, as a WASM plugin."
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
agentoffice-plugin = { path = "../../crates/agentoffice-plugin" }
serde = { version = "1", features = ["derive"] }
