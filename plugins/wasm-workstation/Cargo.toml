[package]
name = "workstation"
version = "0.1.0"
description = "The desk computer: notes, todos, bookmarks, a focus timer and the office shell, as a WASM plugin."
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
agentoffice-plugin = { path = "../../crates/agentoffice-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
