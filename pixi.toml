[workspace]
name = "agentoffice"
description = "A Gather-style virtual coworking office with rpg.actor avatars"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
nodejs = ">=22,<23"
just = "*"

[tasks]
# Thin aliases so `pixi run <name>` works too; the real recipes live in the justfile.
install = "just install"
start = "just start"
dev = "just dev"
agent = "just agent"
test = "just test"
