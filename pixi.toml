[workspace]
name = "agentoffice"
description = "A Gather-style virtual coworking office with rpg.actor avatars"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
nodejs = ">=22,<23"
just = "*"

[tasks]
# Plain-pixi equivalents of the main justfile recipes.
install = "npm ci"
start = "node server/index.js"
dev = "node --watch server/index.js"
agent = "node scripts/agent.mjs"
test = "node --test test/*.test.js"
deps = "[ node_modules/.package-lock.json -nt package-lock.json ] || npm ci"
cf-dev = { cmd = "node_modules/.bin/wrangler dev --port 8787 --ip 127.0.0.1", depends-on = ["deps"] }
deploy = { cmd = "node_modules/.bin/wrangler deploy", depends-on = ["deps"] }

# Rust for the WASM plugins (crates/, plugins/wasm-*): its own environment so
# `just start` doesn't pull a compiler. The justfile's plugin-* recipes use it.
[feature.rust.dependencies]
rust = "1.99.*"
rust-std-wasm32-unknown-unknown = "1.99.*"

[environments]
rust = ["rust"]
