[workspace]
name = "agentoffice"
description = "A Gather-style virtual coworking office with rpg.actor avatars"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
nodejs = ">=22,<23"
just = "*"

[tasks]
# Plain-pixi equivalents of the main justfile recipes.
install = "npm ci"
start = "node server/index.js"
dev = "node --watch server/index.js"
agent = "node scripts/agent.mjs"
test = "node --test test/*.test.js"
cf-dev = "npx wrangler dev --port 8787 --ip 127.0.0.1"
deploy = "npx wrangler deploy"
