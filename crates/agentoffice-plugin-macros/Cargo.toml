[package]
name = "agentoffice-plugin-macros"
version = "0.1.0"
description = "The #[plugin] attribute for agentoffice-plugin: exports the WASM ABI and embeds the manifest."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
serde_json = "1"
