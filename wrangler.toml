# Cloudflare Workers config. `just deploy` publishes it; `just cf-dev` runs it locally.
name = "agentoffice"
main = "worker/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# public/ is served as static assets; requests that don't match a file
# (/ws, /api/*, /healthz) fall through to the Worker.
[assets]
directory = "public"
# The office's own WASM objects (public/plugins/*.wasm, e.g. the rally flag)
# are read from here by the entities that run them.
binding = "ASSETS"

[[durable_objects.bindings]]
name = "OFFICE"
class_name = "OfficeRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OfficeRoom"]

# Every entity is its own Durable Object (worker/entities.js): one per actor
# (DID or agent), per meeting room, per item (desks, whiteboard, notice
# board, arcade, coffee machine, pomodoro timers) and per pub/sub topic.
[[durable_objects.bindings]]
name = "ACTOR"
class_name = "ActorDO"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[durable_objects.bindings]]
name = "ITEM"
class_name = "ItemDO"

[[durable_objects.bindings]]
name = "TOPIC"
class_name = "TopicDO"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ActorDO", "RoomDO", "ItemDO", "TopicDO"]

# Interactive objects (server/plugins.js, docs/plugins.md): each plugin
# object on the map calls PLUGIN_<NAME>, a service binding to a
# WorkerEntrypoint in a plugin Worker. `just deploy` deploys plugins/* first so
# these resolve. A binding that's missing or failing falls back to the
# built-in copy of the object, so the office keeps working without them.
[[services]]
binding = "PLUGIN_JUKEBOX"
service = "agentoffice-objects"
entrypoint = "Jukebox"

[[services]]
binding = "PLUGIN_VENDING"
service = "agentoffice-objects"
entrypoint = "Vending"

[[services]]
binding = "PLUGIN_EIGHTBALL"
service = "agentoffice-objects"
entrypoint = "EightBall"

[[services]]
binding = "PLUGIN_KIOSK"
service = "agentoffice-objects"
entrypoint = "Kiosk"

# Uploaded objects (docs/uploads.md, server/sandbox.js): each plugin people
# upload runs in its own Dynamic Worker, with no network. Needs the Workers
# Paid plan: on the Free plan `wrangler deploy` refuses this binding (`just
# deploy` says so). To run without uploads, comment these two lines out; the
# office then refuses uploads and says why.
[[worker_loaders]]
binding = "LOADER"

# Server roles to start with (comma-separated DIDs): owners run the office,
# admins grant roles and moderate (README "Roles and moderation"). Without
# OWNER_DIDS the first ADMIN_DIDS entry is the owner. LOG_DIDS: extra DIDs
# that may read the server logs over MCP without being admins.
# Any of them can be a secret instead: `just cf-secret OWNER_DIDS`.
# [vars]
# OWNER_DIDS = "did:plc:..."
# ADMIN_DIDS = "did:plc:..."
# LOG_DIDS = "did:plc:..."
